<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SmartCart AI – E-Commerce</title>

  <!-- ✅ PWA META TAGS -->
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SmartCart AI">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="icon" type="image/png" href="/static/favicon.ico">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/static/css/main.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* ✅ MOBILE BOTTOM NAV */
    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #ffffff;
      border-top: 1px solid #e4e7ec;
      padding: 8px 0 12px;
      z-index: 999;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
    }
    .bottom-nav-inner {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .bottom-nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 14px;
      color: #94a3b8;
      font-size: 10px;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      transition: color 0.15s;
      position: relative;
    }
    .bottom-nav-btn i { font-size: 20px; }
    .bottom-nav-btn.active { color: #2d1fe9; }
    .bnav-badge {
      position: absolute; top: 0; right: 6px;
      background: #ef4444; color: white;
      font-size: 9px; font-weight: 700;
      width: 15px; height: 15px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid white;
    }
    @media (max-width: 768px) {
      .bottom-nav { display: block; }
      #appRoot { padding-bottom: 72px; }
    }

    /* ✅ PWA INSTALL BANNER */
    #pwa-banner {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #2563eb; color: white;
      padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between;
      z-index: 9999;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.2);
      font-family: 'Inter', sans-serif;
    }
    .pwa-info { display: flex; align-items: center; gap: 12px; }
    .pwa-info img { width: 42px; height: 42px; border-radius: 10px; }
    .pwa-title { font-weight: 700; font-size: 14px; }
    .pwa-sub { font-size: 12px; opacity: .75; margin-top: 2px; }
    .pwa-btns { display: flex; gap: 8px; }
    .btn-install {
      background: white; color: #2563eb; border: none;
      border-radius: 50px; padding: 9px 20px;
      font-weight: 700; font-size: 13px; cursor: pointer;
      font-family: 'Inter', sans-serif;
    }
    .btn-dismiss {
      background: rgba(255,255,255,.2); color: white; border: none;
      border-radius: 50px; padding: 9px 14px;
      font-size: 13px; cursor: pointer;
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════════ NAVBAR ══ -->
<nav class="navbar" id="navbar">
  <div class="nav-inner">
    <a class="nav-logo" href="#" onclick="navigate('home')">
      <div class="logo-icon"><i class="fas fa-brain"></i></div>
      <div>
        <span class="logo-text">SmartCart</span>
        <span class="logo-ai">AI</span>
        <div class="logo-sub">Powered by Machine Learning</div>
      </div>
    </a>
    <div class="nav-search">
      <input id="searchInput" type="text" placeholder="Search products, brands, categories…" autocomplete="off" />
      <button id="searchBtn" onclick="doSearch()"><i class="fas fa-search"></i></button>
      <div id="searchDropdown" class="search-dropdown hidden"></div>
    </div>
    <div class="nav-actions">
      <div class="nav-btn" id="authBtn" onclick="navigate('login')">
        <i class="fas fa-user-circle"></i>
        <span id="navUsername">Login</span>
      </div>
      <div class="nav-btn" onclick="navigate('wishlist')">
        <i class="fas fa-heart"></i>
        <span>Wishlist</span>
        <span class="badge" id="wishlistBadge">0</span>
      </div>
      <div class="nav-btn" onclick="navigate('cart')">
        <i class="fas fa-shopping-cart"></i>
        <span>Cart</span>
        <span class="badge" id="cartBadge">0</span>
      </div>
      <div class="nav-btn admin-btn hidden" id="adminNavBtn" onclick="navigate('admin')">
        <i class="fas fa-chart-bar"></i>
        <span>Admin</span>
      </div>
    </div>
  </div>
  <div class="cat-bar" id="catBar">
    <div class="cat-inner">
      <span class="cat-item active" onclick="filterCategory(null, this)">All</span>
      <span class="cat-item" onclick="filterCategory('Electronics', this)"><i class="fas fa-microchip"></i> Electronics</span>
      <span class="cat-item" onclick="filterCategory('Fashion', this)"><i class="fas fa-tshirt"></i> Fashion</span>
      <span class="cat-item" onclick="filterCategory('Books', this)"><i class="fas fa-book"></i> Books</span>
      <span class="cat-item" onclick="filterCategory('Sports', this)"><i class="fas fa-running"></i> Sports</span>
      <span class="cat-item" onclick="filterCategory('Beauty', this)"><i class="fas fa-spa"></i> Beauty</span>
      <span class="cat-item" onclick="filterCategory('Toys', this)"><i class="fas fa-gamepad"></i> Toys</span>
      <span class="cat-item" onclick="filterCategory('Grocery', this)"><i class="fas fa-apple-alt"></i> Grocery</span>
      <span class="cat-item" onclick="filterCategory('Health', this)"><i class="fas fa-heartbeat"></i> Health</span>
      <span class="cat-item" onclick="filterCategory('Automotive', this)"><i class="fas fa-car"></i> Auto</span>
    </div>
  </div>
</nav>

<!-- ═══════════════════════════════ PAGES ═══ -->
<main id="appRoot"></main>

<!-- ═══════════════════════════════ TOAST ═══ -->
<div id="toast" class="toast hidden"></div>

<!-- ═══════════════════════════════ MODAL ═══ -->
<div id="modalOverlay" class="modal-overlay hidden" onclick="closeModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div id="modalContent"></div>
  </div>
</div>

<!-- ✅ MOBILE BOTTOM NAV -->
<div class="bottom-nav">
  <div class="bottom-nav-inner">
    <button class="bottom-nav-btn active" id="bnav-home" onclick="navigate('home');setActiveNav('home')">
      <i class="fas fa-home"></i><span>Home</span>
    </button>
    <button class="bottom-nav-btn" id="bnav-search" onclick="navigate('search');setActiveNav('search')">
      <i class="fas fa-search"></i><span>Search</span>
    </button>
    <button class="bottom-nav-btn" id="bnav-wishlist" onclick="navigate('wishlist');setActiveNav('wishlist')">
      <i class="fas fa-heart"></i><span>Wishlist</span>
      <span class="bnav-badge" id="bnavWishBadge" style="display:none">0</span>
    </button>
    <button class="bottom-nav-btn" id="bnav-cart" onclick="navigate('cart');setActiveNav('cart')">
      <i class="fas fa-shopping-cart"></i><span>Cart</span>
      <span class="bnav-badge" id="bnavCartBadge" style="display:none">0</span>
    </button>
    <button class="bottom-nav-btn" id="bnav-profile" onclick="navigate('login');setActiveNav('profile')">
      <i class="fas fa-user"></i><span>Account</span>
    </button>
  </div>
</div>

<!-- ═══════════════════════════════ SCRIPTS ═ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/store.js"></script>
<script src="/static/js/components.js"></script>
<script src="/static/js/pages.js"></script>
<script src="/static/js/admin.js"></script>
<script src="/static/js/app.js"></script>

<!-- ✅ PWA SCRIPT -->
<script>
  // Register Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/static/sw.js')
        .then(reg => console.log('[PWA] ✅ Service Worker registered'))
        .catch(err => console.warn('[PWA] SW failed:', err));
    });
  }

  // Bottom nav active state
  function setActiveNav(page) {
    document.querySelectorAll('.bottom-nav-btn').forEach(b => b.classList.remove('active'));
    const el = document.getElementById('bnav-' + page);
    if (el) el.classList.add('active');
  }

  // Sync cart & wishlist badges to bottom nav
  setInterval(() => {
    const cartBadge = document.getElementById('cartBadge');
    const wishBadge = document.getElementById('wishlistBadge');
    const bCart = document.getElementById('bnavCartBadge');
    const bWish = document.getElementById('bnavWishBadge');
    if (cartBadge && bCart) {
      const v = cartBadge.textContent.trim();
      bCart.textContent = v;
      bCart.style.display = (v === '0' || v === '') ? 'none' : 'flex';
    }
    if (wishBadge && bWish) {
      const v = wishBadge.textContent.trim();
      bWish.textContent = v;
      bWish.style.display = (v === '0' || v === '') ? 'none' : 'flex';
    }
  }, 1000);

  // PWA Install Banner (Android Chrome)
  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    setTimeout(showInstallBanner, 8000);
  });

  function showInstallBanner() {
    if (!deferredPrompt || document.getElementById('pwa-banner')) return;
    const banner = document.createElement('div');
    banner.id = 'pwa-banner';
    banner.innerHTML = `
      <div class="pwa-info">
        <img src="/static/icons/icon-72.png" alt="SmartCart AI">
        <div>
          <div class="pwa-title">Install SmartCart AI</div>
          <div class="pwa-sub">Add to home screen — shop faster!</div>
        </div>
      </div>
      <div class="pwa-btns">
        <button class="btn-install" onclick="installPWA()">Install</button>
        <button class="btn-dismiss" onclick="document.getElementById('pwa-banner').remove()">✕</button>
      </div>`;
    document.body.appendChild(banner);
  }

  async function installPWA() {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    const banner = document.getElementById('pwa-banner');
    if (banner) banner.remove();
  }
</script>

</body>
</html>
